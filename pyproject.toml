[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-comfy-studio"
version = "0.1.0"
description = "A local, serialized Strata and ComfyUI image-generation studio"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.115,<1",
	"uvicorn>=0.30,<1",
	"websockets>=15,<16",
]

[project.optional-dependencies]
test = ["httpx2>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
strata_comfy_studio = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]