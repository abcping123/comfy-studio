[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy-studio"
version = "0.1.0"
description = "A local-first browser studio for ComfyUI image generation with Strata or Bonsai chat backends"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.115,<1",
	"uvicorn>=0.30,<1",
	"websockets>=15,<16",
	"Pillow>=11,<13",
	"psutil>=6,<8; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = ["httpx2>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comfy_studio = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]